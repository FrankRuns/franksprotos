<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supply Chain Machine</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#193c32;background:#e8eee9}*{box-sizing:border-box}body{margin:0}main{max-width:460px;min-height:100dvh;margin:auto;background:#fff;padding:22px;display:flex;flex-direction:column;gap:20px}header{display:flex;align-items:center;gap:12px}.logo{background:#153e33;color:white;border-radius:14px;padding:12px;font-size:24px}.brand{font-weight:800;letter-spacing:-.6px;font-size:21px}.muted{color:#637a70;font-size:13px}.progress{display:flex;gap:6px}.progress i{height:5px;border-radius:8px;flex:1;background:#e3ebe5}.progress i.active{background:#2a8968}h1{font-size:30px;line-height:1.13;letter-spacing:-1px;margin:12px 0}p{line-height:1.5;color:#64776e}textarea{width:100%;font:inherit;min-height:128px;resize:vertical;border:1px solid #c8d9d0;border-radius:15px;padding:15px;outline-color:#218266}button{font:inherit;font-weight:700;border:0;border-radius:13px;padding:16px;cursor:pointer}button.primary{background:#164b3b;color:white;width:100%}button.secondary{background:#eef4ef;color:#245646;width:100%}button:disabled{opacity:.45}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}.map{border-radius:18px;overflow:hidden;background:#e9f1ec}.map svg{display:block;width:100%;height:auto}.card{border-radius:15px;padding:15px;background:#f0f5f1}.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:95px 1fr 45px;align-items:center;gap:8px;font-size:13px}.track{height:15px;border-radius:10px;background:#dfebe2;overflow:hidden}.fill{height:100%;background:#28856b;border-radius:10px}.pill{display:inline-block;padding:6px 10px;border-radius:30px;background:#e6f2eb;color:#206e52;font-size:12px;font-weight:700}.small{font-size:12px}.footer{font-size:12px;color:#75877c;text-align:center;margin-top:auto}label{font-size:13px;font-weight:700}
</style></head><body><main><header><span class="logo">◇</span><div><div class="brand">SUPPLY CHAIN MACHINE</div><div class="muted">Describe it. See it. Improve it.</div></div></header><div class="progress" id="progress"></div><section class="screen" id="screen"></section><div class="footer">Prototype · Illustrative network and assumptions</div></main>
<script>
const S={step:0,view:'question',answers:[],warehouses:[],customers:[],shipments:40,albany:25,pallets:[15,40,35,10]};
const cities={Hartford:[225,223],Albany:[103,107],Springfield:[237,162],Boston:[366,155],'New Haven':[199,305],Schenectady:[73,96],Saratoga:[120,52],Poughkeepsie:[108,239],Waterbury:[190,259],Worcester:[300,202]};
const prompts=[['Where are your warehouses?','Cities are enough. We can get precise later.','I have warehouses in Hartford, CT and Albany, NY.'],['Where are your customers?','Which regions or cities does each warehouse serve?','Hartford serves Springfield, Boston, and New Haven. Albany serves Schenectady, Saratoga, and Poughkeepsie.'],['What does your outbound shipment profile look like?','Tell me about shipments per week, pallets per shipment, and delivery frequency.','Hartford sends 40 shipments a week, Albany 25. Most loads are 3–6 pallets, shipping 2–3 times per week.']];
const el=document.getElementById('screen');
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function progress(){document.getElementById('progress').innerHTML=prompts.map((_,i)=>'<i class="'+(i<=S.step?'active':'')+'"></i>').join('')}
function parse(){const a=S.answers[0]||'';S.warehouses=Object.keys(cities).filter(c=>a.toLowerCase().includes(c.toLowerCase())).slice(0,4);if(!S.warehouses.length)S.warehouses=['Hartford','Albany'];const b=S.answers[1]||'';S.customers=Object.keys(cities).filter(c=>!S.warehouses.includes(c)&&b.toLowerCase().includes(c.toLowerCase()));const t=S.answers[2]||'';const nums=[...t.matchAll(/(\d+)\s*(?:shipments|loads)/gi)].map(m=>+m[1]);if(nums[0])S.shipments=nums[0];if(nums[1])S.albany=nums[1]}
function map(){let lines=S.customers.map((c,i)=>{const src=S.warehouses[i%S.warehouses.length],a=cities[src],b=cities[c];return a&&b?'<path d="M'+a[0]+' '+a[1]+' Q'+((a[0]+b[0])/2+12)+' '+((a[1]+b[1])/2-22)+' '+b[0]+' '+b[1]+'" fill="none" stroke="#d08c57" stroke-width="2.5" stroke-dasharray="6 4"/>':''}).join('');const dots=(S.customers.map(c=>({c,warehouse:false})).concat(S.warehouses.map(c=>({c,warehouse:true})))).map(({c,warehouse})=>{const [x,y]=cities[c];return '<circle cx="'+x+'" cy="'+y+'" r="'+(warehouse?12:7)+'" fill="'+(warehouse?'#164b3b':'#fff')+'" stroke="'+(warehouse?'#fff':'#d08c57')+'" stroke-width="3"/><text x="'+(x+12)+'" y="'+(y-11)+'" fill="#164b3b" font-size="11" font-weight="700">'+esc(c)+'</text>'}).join('');return '<div class="map"><svg viewBox="0 0 430 350" role="img" aria-label="Schematic supply chain network"><rect width="430" height="350" fill="#e9f1ec"/><path d="M0 80H430 M0 175H430 M0 270H430 M100 0V350 M210 0V350 M320 0V350" stroke="#d3e1d6" stroke-dasharray="4 6" fill="none"/>'+lines+dots+'</svg></div><div class="muted">Schematic map · '+S.warehouses.length+' warehouses · '+S.customers.length+' destinations</div>'}
function bars(){const rows=[['Hartford',S.shipments],['Albany',S.albany]],max=Math.max(...rows.map(x=>x[1]),1);return '<div class="card"><b>Weekly outbound shipments</b><div class="bars" style="margin-top:16px">'+rows.map(([n,v])=>'<div class="barrow"><span>'+n+'</span><div class="track"><div class="fill" style="width:'+100*v/max+'%"></div></div><strong>'+v+'</strong></div>').join('')+'</div></div><div class="card"><b>Estimated shipment-size mix</b><div class="muted">Editable assumptions, not measured data</div><div class="bars" style="margin-top:14px">'+['1–2 pallets','3–4 pallets','5–6 pallets','7+ pallets'].map((n,i)=>'<div class="barrow"><span>'+n+'</span><div class="track"><div class="fill" style="width:'+S.pallets[i]+'%"></div></div><strong>'+S.pallets[i]+'%</strong></div>').join('')+'</div></div>'}
function render(){progress();if(S.view==='question'){el.innerHTML='<span class="pill">QUESTION '+(S.step+1)+' OF 3</span><h1>'+prompts[S.step][0]+'</h1><p>'+prompts[S.step][1]+'</p><textarea id="answer" placeholder="'+esc(prompts[S.step][2])+'">'+esc(S.answers[S.step]||'')+'</textarea><button class="primary" id="submit">Show me →</button><button class="secondary" id="example">Try example</button>';document.getElementById('submit').onclick=()=>submit(document.getElementById('answer').value);document.getElementById('example').onclick=()=>submit(prompts[S.step][2]);return}if(S.view==='reveal'){el.innerHTML='<span class="pill">✓ NETWORK UPDATED</span><h1>'+['Your warehouses are on the map.','Your outbound network is taking shape.','Now let’s check your shipment profile.'][S.step]+'</h1>'+map()+(S.step===2?bars():'')+'<div class="card"><label>YOU SAID</label><p class="small">'+esc(S.answers[S.step])+'</p></div>'+(S.step===2?'<p class="small">Does this distribution look right? The mix is a starting assumption, not inferred from your description.</p>':'')+'<button class="primary" id="next">'+(S.step===2?'Review assumptions':'Next question')+' →</button><button class="secondary" id="edit">Edit answer</button>';document.getElementById('next').onclick=()=>{if(S.step<2){S.step++;S.view='question'}else S.view='review';render()};document.getElementById('edit').onclick=()=>{S.view='question';render()};return}el.innerHTML='<span class="pill">CHECK OUR ASSUMPTIONS</span><h1>Does this look like your freight?</h1>'+map()+bars()+'<div class="card"><label>Adjust the estimated shipment mix (%)</label>'+S.pallets.map((v,i)=>'<div style="margin-top:12px"><label>'+['1–2 pallets','3–4 pallets','5–6 pallets','7+ pallets'][i]+' <span id="n'+i+'">'+v+'</span>%</label><input style="width:100%" type="range" min="0" max="100" value="'+v+'" data-i="'+i+'"></div>').join('')+'</div><button class="primary" id="confirm">Confirm shipment profile</button><button class="secondary" id="restart">Start over</button>';document.querySelectorAll('input[type=range]').forEach(e=>e.oninput=()=>{S.pallets[+e.dataset.i]=+e.value;document.getElementById('n'+e.dataset.i).textContent=e.value});document.getElementById('confirm').onclick=()=>{el.insertAdjacentHTML('beforeend','<div class="card"><b>Profile noted.</b><p>Next: actual shipment records, service windows, and rates so we can compare feasible consolidation opportunities without inventing savings.</p></div>')};document.getElementById('restart').onclick=()=>{S.step=0;S.view='question';S.answers=[];S.customers=[];render()}}
function submit(value){if(!value.trim())return;S.answers[S.step]=value.trim();parse();S.view='reveal';render()}render();
</script></body></html>
