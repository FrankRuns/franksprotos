<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e29"><title>Supply Chain Machine</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,sans-serif;background:#e8efeb;color:#173c32}button,textarea{font:inherit}button{cursor:pointer}main{max-width:780px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:#f8faf8;overflow:hidden}header{background:#102e29;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 17px;flex:none}.brand{font-size:15px;font-weight:850;letter-spacing:.3px}.sub{font-size:11px;color:#a5c8b9;margin-top:2px}.reset{border:1px solid #547469;color:#e7f2ed;background:none;border-radius:9px;padding:7px 10px;font-size:12px}.workspace{flex:1;min-height:0;display:flex;flex-direction:column;gap:0}.model{position:relative;flex:1;min-height:220px;background:#dce9e0;overflow:hidden}#map{height:100%;width:100%;z-index:1}.maphead{position:absolute;z-index:500;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.maphead span{background:#fffef9ed;border-radius:10px;padding:8px 11px;box-shadow:0 2px 12px #153b301b;font-size:12px;font-weight:700}.leaflet-container{background:#e1eae5}.leaflet-control-attribution{font-size:9px!important}.pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:#db9753;box-shadow:0 2px 8px #1c453a65;animation:pop .6s both}.pin.dc{width:25px;height:25px;border-radius:8px;background:#176a50;transform:rotate(45deg)}.pin.customer{background:#d79450}.leaflet-tooltip{border:0;border-radius:7px;box-shadow:0 1px 8px #1235;font-size:11px;font-weight:700;padding:4px 7px}.stats{display:flex;gap:8px;padding:10px 12px;background:#f8faf8;flex:none;border-bottom:1px solid #e1e9e2}.stat{flex:1;min-width:0;background:#eaf2ec;border-radius:12px;padding:9px 11px}.stat small{display:block;color:#61786a;font-size:10px}.stat b{font-size:22px;letter-spacing:-.7px}.insight{display:none;padding:11px 16px;background:#f0f6f0;border-bottom:1px solid #e0eae1;flex:none;animation:rise .4s}.insight.visible{display:block}.insight strong{font-size:12px}.bars{display:flex;gap:10px;margin-top:9px;align-items:flex-end;height:48px}.bar{flex:1;display:flex;align-items:center;gap:6px;font-size:10px}.bartrack{flex:1;height:9px;background:#d5e4d8;border-radius:20px;overflow:hidden}.barfill{height:100%;background:#2e9270;border-radius:20px;transition:width .65s ease}.conversation{background:#fff;border-top:1px solid #dbe5dd;padding:14px 15px max(16px,env(safe-area-inset-bottom));flex:none;box-shadow:0 -6px 25px #173b2a0d}.eyebrow{font-size:10px;color:#278464;font-weight:800;letter-spacing:1px}.question{font-size:18px;font-weight:750;line-height:1.3;margin:6px 0}.hint{font-size:12px;color:#6d8175;margin:0 0 11px}.inputrow{display:flex;gap:9px;align-items:flex-end}textarea{width:100%;height:65px;min-height:48px;max-height:120px;resize:vertical;border:1px solid #cdded2;border-radius:12px;padding:11px;outline-color:#318a6b;font-size:14px;background:#fcfefd}button.send{background:#146447;color:white;border:0;border-radius:12px;padding:15px 17px;font-size:19px}.actions{display:flex;justify-content:space-between;margin-top:10px;gap:10px}.linkbtn{border:0;background:none;color:#2a775e;font-size:12px;font-weight:700;padding:4px}.status{color:#7a8e81;font-size:11px;margin-top:7px;min-height:14px}.fade{animation:rise .45s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{from{opacity:0;scale:.2}to{opacity:1;scale:1}}@media(min-width:700px){main{border-left:1px solid #d3ded6;border-right:1px solid #d3ded6}.conversation{padding:18px 25px 22px}.model{min-height:320px}.question{font-size:21px}}
</style></head><body><main><header><div><div class="brand">◇ SUPPLY CHAIN MACHINE</div><div class="sub">A model you build by talking</div></div><button class="reset" id="reset">Start over</button></header>
<div class="workspace"><div class="model"><div id="map"></div><div class="maphead"><span>◉ LIVE NETWORK</span><span id="mapstate">Waiting for locations</span></div></div><div class="stats"><div class="stat"><small>Warehouses</small><b id="dcs">0</b></div><div class="stat"><small>Customers</small><b id="customers">0</b></div><div class="stat"><small>Shipments / wk</small><b id="shipments">—</b></div></div><div class="insight" id="insight"></div></div>
<section class="conversation"><div class="eyebrow" id="step">BUILD YOUR MODEL · 1 / 3</div><div class="question fade" id="question">Where are your warehouses?</div><p class="hint" id="hint">Tell me their cities. Watch them appear on the map.</p><div class="inputrow"><textarea id="answer" aria-label="Your answer" placeholder="I have warehouses in Hartford and Albany"></textarea><button class="send" id="send" aria-label="Add to model">↑</button></div><div class="actions"><button class="linkbtn" id="example">Use an example</button><button class="linkbtn" id="back" style="display:none">← Previous</button></div><div class="status" id="status">Illustrative network. No optimization performed yet.</div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const catalog={Hartford:[41.7658,-72.6734],Albany:[42.6526,-73.7562],Springfield:[42.1015,-72.5898],Boston:[42.3601,-71.0589],'New Haven':[41.3083,-72.9279],Schenectady:[42.8142,-73.9396],Saratoga:[43.0831,-73.7846],Poughkeepsie:[41.7004,-73.921],Waterbury:[41.5582,-73.0515],Worcester:[42.2626,-71.8023],Providence:[41.824,-71.4128],Stamford:[41.0534,-73.5387],Bridgeport:[41.1792,-73.1894],Danbury:[41.3948,-73.454],Newark:[40.7357,-74.1724],Philadelphia:[39.9526,-75.1636],Buffalo:[42.8864,-78.8784],Rochester:[43.1566,-77.6088],Syracuse:[43.0481,-76.1474],Portland:[43.6591,-70.2568],Manchester:[42.9956,-71.4548],Nashua:[42.7654,-71.4676],Burlington:[44.4759,-73.2121],Pittsfield:[42.4501,-73.2454],Troy:[42.7284,-73.6918]};
const prompts=[{q:'Where are your warehouses?',hint:'Tell me their cities. Watch them appear on the map.',example:'I have warehouses in Hartford, CT and Albany, NY.'},{q:'Where are your customers?',hint:'Name cities or regions. New destinations and connections will fade in.',example:'We serve Springfield, Boston, New Haven, Schenectady, Saratoga, and Poughkeepsie.'},{q:'What does outbound shipping look like?',hint:'Shipments per week, load sizes, or delivery frequency. Rough estimates are fine.',example:'Hartford ships 40 loads a week, Albany ships 25. Most are 3–6 pallets.'}];
const state={step:0,answers:['','',''],warehouses:[],customers:[],loads:[],markers:[],lines:[]};const $=id=>document.getElementById(id);
const map=window.L?L.map('map',{zoomControl:false,scrollWheelZoom:false}).setView([42.35,-72.75],7):null;
if(map){L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:18}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map)}
else $('map').innerHTML='<div style="padding:70px 25px;color:#49675b">Map tiles require an internet connection.</div>';
function found(text){return Object.keys(catalog).filter(city=>new RegExp('\\b'+city.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(text))}
function parse(){state.warehouses=found(state.answers[0]);state.customers=found(state.answers[1]).filter(x=>!state.warehouses.includes(x));const t=state.answers[2];const named=state.warehouses.map(c=>{const m=t.match(new RegExp(c+'[^\\d]{0,28}(\\d+)','i'));return m?+m[1]:null});const generic=[...t.matchAll(/(\d+)\s*(?:shipments|loads)/gi)].map(x=>+x[1]);state.loads=named.some(v=>v!==null)?named:generic.length?generic:[]}
function redraw(){if(!map)return;state.markers.forEach(x=>map.removeLayer(x));state.lines.forEach(x=>map.removeLayer(x));state.markers=[];state.lines=[];const pts=[];
state.customers.forEach(c=>{const p=catalog[c];pts.push(p);const m=L.marker(p,{icon:L.divIcon({className:'',html:'<div class="pin customer"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).bindTooltip(c,{direction:'top',offset:[0,-10]});m.addTo(map);state.markers.push(m);
if(state.warehouses.length){const dc=state.warehouses.reduce((best,w)=>{const a=catalog[w],b=catalog[best],dist=x=>Math.hypot(x[0]-p[0],(x[1]-p[1])*Math.cos(p[0]*Math.PI/180));return dist(a)<dist(b)?w:best},state.warehouses[0]);const line=L.polyline([catalog[dc],p],{color:'#c48b52',weight:2.5,opacity:.65,dashArray:'5 7'}).addTo(map);state.lines.push(line)}});state.warehouses.forEach(c=>{const p=catalog[c];pts.push(p);const m=L.marker(p,{icon:L.divIcon({className:'',html:'<div class="pin dc"></div>',iconSize:[27,27],iconAnchor:[13,13]})}).bindTooltip('Warehouse · '+c,{permanent:true,direction:'top',offset:[0,-12]});m.addTo(map);state.markers.push(m)});if(pts.length)map.flyToBounds(L.latLngBounds(pts).pad(.25),{duration:.8,maxZoom:9});$('mapstate').textContent=pts.length?pts.length+' locations mapped':'Waiting for locations'}
function stats(){$('dcs').textContent=state.warehouses.length;$('customers').textContent=state.customers.length;$('shipments').textContent=state.loads.length?state.loads.reduce((a,b)=>a+(b||0),0):'—';const panel=$('insight');if(state.step<2||!state.answers[2]){panel.classList.remove('visible');return}const rows=state.warehouses.map((c,i)=>({name:c,value:state.loads[i]||0}));const max=Math.max(1,...rows.map(r=>r.value));panel.innerHTML='<strong>OUTBOUND SHIPMENT PROFILE</strong><div class="bars">'+rows.map(r=>'<div class="bar"><span>'+r.name+'</span><div class="bartrack"><div class="barfill" style="width:'+r.value/max*100+'%"></div></div><b>'+r.value+'</b></div>').join('')+'</div><div style="font-size:10px;color:#70877a;margin-top:8px">Values extracted from your description; lanes show nearest straight-line warehouse, not validated assignments.</div>';panel.classList.add('visible')}
function render(){parse();redraw();stats();const p=prompts[Math.min(state.step,2)];$('step').textContent=state.step>=3?'MODEL CREATED · KEEP REFINING':'BUILD YOUR MODEL · '+(state.step+1)+' / 3';$('question').textContent=state.step>=3?'What would you like to change?':p.q;$('hint').textContent=state.step>=3?'Edit a previous answer or describe more details. This prototype does not yet run an optimizer.':p.hint;$('answer').value=state.step>=3?'':state.answers[state.step];$('answer').placeholder=state.step>=3?'Try: Change my customer locations…':p.example;$('example').textContent=state.step>=3?'Edit warehouse locations':'Use an example';$('back').style.display=state.step>0?'block':'none';$('status').textContent=state.step>=3?'Next: validate lanes, costs, constraints, and optimization objective.':'Recognizes '+Object.keys(catalog).length+' cities. Unrecognized places are not mapped yet.'}
function submit(){const v=$('answer').value.trim();if(!v)return;if(state.step>=3){$('status').textContent='To change your model, use Previous to edit an answer. Free-form edits are coming next.';return}state.answers[state.step]=v;state.step++;render();$('answer').focus()}
$('send').onclick=submit;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});$('example').onclick=()=>{if(state.step>=3){state.step=0;render();return}$('answer').value=prompts[state.step].example;submit()};$('back').onclick=()=>{state.step=Math.max(0,state.step-1);render()};$('reset').onclick=()=>{state.step=0;state.answers=['','',''];render()};render();setTimeout(()=>map&&map.invalidateSize(),250);
</script></body></html>
